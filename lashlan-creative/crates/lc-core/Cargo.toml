[package]
name = "lc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# "files" pulls in the decoders and encoders. Leave it out to build the
# adjustment maths alone, for example for WebAssembly in a browser.
default = ["files"]
files = ["dep:image", "dep:kamadak-exif"]

[dependencies]
image = { workspace = true, optional = true }
kamadak-exif = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620"><rect width="1600" height="620" fill="#0a0908"/><text x="60" y="58" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">THE CHRONICLE COMPANY</text><text x="60" y="108" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="38" font-weight="500" text-anchor="start">What it costs you, and what it is worth</text><text x="60" y="146" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">The gap between these three numbers is the business.</text><line x1="60" y1="170" x2="1540" y2="170" stroke="#2a241a" stroke-width="2"/><rect x="60" y="240" width="460" height="290" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="60" y1="240" x2="520" y2="240" stroke="#c8a96a" stroke-width="3"/><text x="88" y="288" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">COSTS YOU TO RUN A SITE</text><text x="88" y="374" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="64" font-weight="600" text-anchor="start">15</text><text x="88" y="414" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">US dollars a year</text><text x="88" y="466" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" text-anchor="start">The web address. Everything else</text><text x="88" y="492" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" text-anchor="start">is free.</text><rect x="570" y="240" width="460" height="290" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="570" y1="240" x2="1030" y2="240" stroke="#c8a96a" stroke-width="3"/><text x="598" y="288" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">YOU CHARGE TO BUILD IT</text><text x="598" y="374" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="40" font-weight="600" text-anchor="start">5,500 to 9,000</text><text x="598" y="414" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">US dollars, once</text><text x="598" y="466" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" text-anchor="start">A commissioned biography, not a</text><text x="598" y="492" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" text-anchor="start">website.</text><rect x="1080" y="240" width="460" height="290" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="1080" y1="240" x2="1540" y2="240" stroke="#c8a96a" stroke-width="3"/><text x="1108" y="288" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">YOU CHARGE TO LOOK AFTER IT</text><text x="1108" y="374" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="40" font-weight="600" text-anchor="start">400 to 800</text><text x="1108" y="414" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">US dollars a year</text><text x="1108" y="466" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" text-anchor="start">Thirty families is 12,000 to</text><text x="1108" y="492" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="18" font-weight="400" text-anchor="start">24,000 a year.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790"><rect width="1600" height="790" fill="#0a0908"/><text x="60" y="58" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">THE CHRONICLE COMPANY</text><text x="60" y="108" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="38" font-weight="500" text-anchor="start">Who makes what</text><text x="60" y="146" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">Three makers. One finished Chronicle.</text><line x1="60" y1="170" x2="1540" y2="170" stroke="#2a241a" stroke-width="2"/><rect x="60" y="230" width="440" height="232" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="60" y1="230" x2="500" y2="230" stroke="#c8a96a" stroke-width="3"/><text x="90" y="292" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" text-anchor="start">Claude Code</text><text x="90" y="336" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Writes the website itself:</text><text x="90" y="364" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">every page, the opening film,</text><text x="90" y="392" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">the read-aloud machinery.</text><rect x="570" y="230" width="440" height="232" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="570" y1="230" x2="1010" y2="230" stroke="#c8a96a" stroke-width="3"/><text x="600" y="292" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" text-anchor="start">ChatGPT</text><text x="600" y="336" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Makes and improves pictures.</text><text x="600" y="364" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Sharpens the writing before</text><text x="600" y="392" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">it goes on the page.</text><rect x="1080" y="230" width="440" height="232" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="1080" y1="230" x2="1520" y2="230" stroke="#c8a96a" stroke-width="3"/><text x="1110" y="292" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" text-anchor="start">Text to speech</text><text x="1110" y="336" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Reads the whole Chronicle</text><text x="1110" y="364" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">aloud in a real voice. Under</text><text x="1110" y="392" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">five dollars a site.</text><line x1="280.0" y1="478" x2="280.0" y2="588" stroke="#9a7f45" stroke-width="2"/><path d="M 280.0 600 L 273.0 586 L 287.0 586 Z" fill="#9a7f45"/><line x1="790.0" y1="478" x2="790.0" y2="588" stroke="#9a7f45" stroke-width="2"/><path d="M 790.0 600 L 783.0 586 L 797.0 586 Z" fill="#9a7f45"/><line x1="1300.0" y1="478" x2="1300.0" y2="588" stroke="#9a7f45" stroke-width="2"/><path d="M 1300.0 600 L 1293.0 586 L 1307.0 586 Z" fill="#9a7f45"/><rect x="60" y="600" width="1480" height="130" fill="#16140f" stroke="#c8a96a" stroke-width="3"/><text x="800.0" y="664" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="36" font-weight="600" text-anchor="middle" letter-spacing="8">THE CHRONICLE</text><text x="800.0" y="702" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="20" font-weight="400" text-anchor="middle">One life, researched, written, illustrated, narrated and published</text></svg>
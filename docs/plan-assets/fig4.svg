<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190"><rect width="1600" height="1190" fill="#0a0908"/><text x="60" y="58" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">THE CHRONICLE COMPANY</text><text x="60" y="108" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="38" font-weight="500" text-anchor="start">The nine stages of a commission</text><text x="60" y="146" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">In order. The first one is never skipped, for any fee.</text><line x1="60" y1="170" x2="1540" y2="170" stroke="#2a241a" stroke-width="2"/><text x="60" y="230" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">AGREE</text><circle cx="86" cy="282" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="290" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">1</text><text x="134" y="276" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">Commission and consent</text><text x="134" y="308" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Signed permission from every living person: their picture, their words, their voice.</text><circle cx="86" cy="366" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="374" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">2</text><text x="134" y="360" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">Collect</text><text x="134" y="392" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Interviews, photographs, documents. Every fact gets a source you can point at.</text><circle cx="86" cy="450" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="458" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">3</text><text x="134" y="444" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">Write</text><text x="134" y="476" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">All the writing into one file. Every unknown left as a marked gap.</text><text x="60" y="530" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">MAKE</text><circle cx="86" cy="582" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="590" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">4</text><text x="134" y="576" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">Photographs</text><text x="134" y="608" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Three web sizes of each, made automatically.</text><circle cx="86" cy="666" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="674" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">5</text><text x="134" y="660" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">The still site</text><text x="134" y="692" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Finished and readable, with no animation at all. This is the floor.</text><circle cx="86" cy="750" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="758" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">6</text><text x="134" y="744" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">The film</text><text x="134" y="776" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Built on top of the floor, never instead of it.</text><circle cx="86" cy="834" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="842" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">7</text><text x="134" y="828" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">Narration</text><text x="134" y="860" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Only once the words are final.</text><text x="60" y="914" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">DELIVER</text><circle cx="86" cy="966" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="974" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">8</text><text x="134" y="960" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">Verify, then show them</text><text x="134" y="992" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Phone and laptop. Publish only on their word.</text><circle cx="86" cy="1050" r="24" fill="none" stroke="#c8a96a" stroke-width="2"/><text x="86" y="1058" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="22" font-weight="600" text-anchor="middle">9</text><text x="134" y="1044" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="25" font-weight="500" text-anchor="start">Hand over</text><text x="134" y="1076" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Their editing guide, their password, and who inherits it all.</text></svg>
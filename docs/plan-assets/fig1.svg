<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"><rect width="1600" height="760" fill="#0a0908"/><text x="60" y="58" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">THE CHRONICLE COMPANY</text><text x="60" y="108" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="38" font-weight="500" text-anchor="start">How a Chronicle reaches the family</text><text x="60" y="146" fill="#a89e8f" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">Four steps. Only the first one involves you.</text><line x1="60" y1="170" x2="1540" y2="170" stroke="#2a241a" stroke-width="2"/><rect x="50" y="250" width="315" height="300" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="50" y1="250" x2="365" y2="250" stroke="#c8a96a" stroke-width="3"/><text x="78" y="308" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="30" font-weight="600" text-anchor="start">1</text><text x="78" y="354" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" text-anchor="start">You and Claude</text><text x="78" y="402" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">The writing, the photos</text><text x="78" y="430" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">and the site are made.</text><text x="78" y="522" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">YOUR LAPTOP</text><line x1="387" y1="400.0" x2="411" y2="400.0" stroke="#9a7f45" stroke-width="2"/><path d="M 423 400.0 L 409 393.0 L 409 407.0 Z" fill="#9a7f45"/><rect x="445" y="250" width="315" height="300" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="445" y1="250" x2="760" y2="250" stroke="#c8a96a" stroke-width="3"/><text x="473" y="308" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="30" font-weight="600" text-anchor="start">2</text><text x="473" y="354" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" text-anchor="start">GitHub</text><text x="473" y="402" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Every page, photo and</text><text x="473" y="430" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">recording is filed here.</text><text x="473" y="522" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">THE FILING CABINET</text><line x1="782" y1="400.0" x2="806" y2="400.0" stroke="#9a7f45" stroke-width="2"/><path d="M 818 400.0 L 804 393.0 L 804 407.0 Z" fill="#9a7f45"/><rect x="840" y="250" width="315" height="300" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="840" y1="250" x2="1155" y2="250" stroke="#c8a96a" stroke-width="3"/><text x="868" y="308" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="30" font-weight="600" text-anchor="start">3</text><text x="868" y="354" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" text-anchor="start">Cloudflare</text><text x="868" y="402" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">Shown from the nearest</text><text x="868" y="430" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">of about 300 cities.</text><text x="868" y="522" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">THE SHOP WINDOW</text><line x1="1177" y1="400.0" x2="1201" y2="400.0" stroke="#9a7f45" stroke-width="2"/><path d="M 1213 400.0 L 1199 393.0 L 1199 407.0 Z" fill="#9a7f45"/><rect x="1235" y="250" width="315" height="300" fill="#16140f" stroke="#2a241a" stroke-width="2"/><line x1="1235" y1="250" x2="1550" y2="250" stroke="#c8a96a" stroke-width="3"/><text x="1263" y="308" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="30" font-weight="600" text-anchor="start">4</text><text x="1263" y="354" fill="#f2ece1" font-family="Inter, 'Liberation Sans', sans-serif" font-size="27" font-weight="500" text-anchor="start">The family</text><text x="1263" y="402" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">They open a link. It</text><text x="1263" y="430" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="19" font-weight="400" text-anchor="start">reads itself aloud.</text><text x="1263" y="522" fill="#9a7f45" font-family="Inter, 'Liberation Sans', sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="4">ANYWHERE</text><text x="60" y="640" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">The filing cabinet is also your backup: every older version is kept forever.</text><text x="60" y="676" fill="#ddd4c5" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">Change anything and the shop window rebuilds itself in about five minutes.</text><text x="60" y="712" fill="#c8a96a" font-family="Inter, 'Liberation Sans', sans-serif" font-size="21" font-weight="400" text-anchor="start">Nothing is ever uploaded by hand.</text></svg>